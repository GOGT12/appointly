services:
  postgres:
    image: postgres:16-alpine
    container_name: appointly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appointly
      POSTGRES_PASSWORD: appointly_dev_password
      POSTGRES_DB: appointly
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: appointly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
